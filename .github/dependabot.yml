# Inactive repo: no version updates. Security minor/patch share one group; majors stay separate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
